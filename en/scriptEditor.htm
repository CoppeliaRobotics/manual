<h1>Script editor</h1>


<p>The script editor allows editing <a href="simulationScripts.htm">simulation-</a> and <a href="customizationScripts.htm">customization scripts</a> in CoppeliaSim. It is opened by double-clicking a <a href="scriptObjects.htm">script object</a> in the <a href="userInterface.htm#SceneHierarchy">scene hierarchy</a>.<br>
</p>

<p align=center><img src="images/scriptEditor1.jpg"></p>
<p class=imageLabel>[Script editor]</p>
<br>

<p>An external script editor can also be specified by editing <em><a href="commandLine.htm#settingsFile">usrset.txt</a></em> and restarting CoppeliaSim. </p>
